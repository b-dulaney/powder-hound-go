# Images are built by GitHub Actions (.github/workflows/deploy.yml); the deploy sets IMAGE_TAG
# to the commit SHA. The server's ../../.env is passed to the containers at runtime.
version: "3"
services:
  client:
    image: ghcr.io/b-dulaney/powder-hound-go/email-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["make", "client"]
    depends_on:
      - redis
    env_file: ../../.env
    environment:
      - REDIS_HOST=redis
  worker:
    image: ghcr.io/b-dulaney/powder-hound-go/email-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["make", "worker"]
    depends_on:
      - redis
    env_file: ../../.env
    environment:
      - REDIS_HOST=redis
  asynqmon:
    image: hibiken/asynqmon:latest
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
  redis:
    image: "redis/redis-stack-server:7.2.0-v9-x86_64"
    restart: unless-stopped
